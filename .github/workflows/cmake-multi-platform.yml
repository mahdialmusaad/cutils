name: CMake on multiple platforms
on:
  pull_request:
  push:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: read
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Configure and build
      run: |
        cmake -B build
        cmake --build build
  macos:
    name: MacOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - name: Configure and build
      run: |
        cmake -DCU_SETTING_QUIET=ON -B build
        cmake --build build
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - name: Configure and build
      run: |
        cmake -B build -A x64
        cmake --build build